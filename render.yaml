services:
  - type: web
    name: over-the-shoulder
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # you will paste this manually in the Render dashboard
      - key: LIVE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: GUIDE_MODEL
        value: gemini-3.5-flash-lite
      - key: MAX_SESSION_MINUTES
        value: "10"
      - key: DEMO_PASSCODE
        sync: false          # optional — leave blank for public access
